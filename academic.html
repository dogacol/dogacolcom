<!DOCTYPE html>
<html lang="en" class="lang-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Academic papers and publications by Doğa Çöl.">
    <title>Academic Papers - Doğa Çöl</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="images/website images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 20px;
            margin: 0;
            line-height: 1.5;
        }
        .content {
            max-width: 100%;
            padding: 10px;
            text-align: left;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        .file-link {
            font-size: 1.3em;
            margin: 10px 0;
            cursor: pointer;
            color: #333;
            text-decoration: underline;
        }
        .file-link:hover {
            color: #000;
        }
        .file-content {
            font-size: 1.2em;
            color: #333;
            background-color: #fff;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            width: 60%;
            max-width: 800px;
            display: none;
            line-height: 1.5;
        }

        .file-content p {
            text-align: justify;
        }

        .footer {
            margin-top: 50px;
        }
        .back-button {
            margin-bottom: 20px;
            text-align: center;
        }
        .back-button button {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }
        .back-button button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="lang-toggle">
        <button id="lang-en" onclick="setLang('en')">EN</button>
        <span class="sep">/</span>
        <button id="lang-tr" onclick="setLang('tr')">TR</button>
    </div>
    <div class="content">
        <h1>
            <span class="en-only">Academic Papers</span>
            <span class="tr-only">Akademik Yazılar</span>
        </h1>
        <div id="files"></div>
        <div id="file-content" class="file-content"></div>
    </div>
    <div class="back-button">
        <button onclick="goToIndex()">
            <span class="en-only">&#8592; Back</span>
            <span class="tr-only">&#8592; Geri</span>
        </button>
    </div>

    <div class="footer">
        &copy; Doğa Çöl
    </div>

    <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
    <script>
        const filesContainer = document.getElementById('files');
        const fileContentDiv = document.getElementById('file-content');
        const repoUrl = "https://api.github.com/repos/dogacol/Academic-Papers/contents";

        function setLang(lang) {
            document.documentElement.className = 'lang-' + lang;
            document.documentElement.setAttribute('lang', lang === 'tr' ? 'tr' : 'en');
            localStorage.setItem('lang', lang);
            document.getElementById('lang-en').className = lang === 'en' ? 'active' : '';
            document.getElementById('lang-tr').className = lang === 'tr' ? 'active' : '';
            document.title = lang === 'tr' ? 'Akademik Yazılar - Doğa Çöl' : 'Academic Papers - Doğa Çöl';
        }

        // Load saved preference or default to English
        setLang(localStorage.getItem('lang') || 'en');

        // Raw markdown for each paper, keyed by file name, so loadFileContent
        // doesn't need to re-fetch what the list step already downloaded.
        const contentCache = {};

        // Splits a leading "---\ntitle: "..."\nyear: NNNN\n---" block (if any)
        // off the markdown and returns { title, year, body }.
        function parseFrontmatter(markdown) {
            const match = markdown.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
            if (!match) return { title: null, year: null, body: markdown };
            const block = match[1];
            const titleMatch = block.match(/^title:\s*["'](.+?)["']\s*$/m);
            const yearMatch = block.match(/^year:\s*(\d{4})\s*$/m);
            return {
                title: titleMatch ? titleMatch[1] : null,
                year: yearMatch ? parseInt(yearMatch[1], 10) : null,
                body: markdown.slice(match[0].length)
            };
        }

        // Fetch the file list, then each paper's raw markdown, so papers can
        // be sorted by year (newest first) before anything is rendered.
        filesContainer.textContent = document.documentElement.className === 'lang-tr' ? 'Yükleniyor…' : 'Loading…';
        fetch(repoUrl)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(data => data.filter(file => file.name.endsWith('.md')))
            .then(mdFiles => Promise.all(mdFiles.map(file => {
                const fileUrl = `https://raw.githubusercontent.com/dogacol/Academic-Papers/main/${encodeURIComponent(file.name)}`;
                return fetch(fileUrl)
                    .then(response => response.text())
                    .then(markdown => {
                        contentCache[file.name] = markdown;
                        const { title, year } = parseFrontmatter(markdown);
                        return {
                            name: file.name,
                            title: title || file.name.replace(/\.md$/, ''),
                            year
                        };
                    });
            })))
            .then(papers => {
                papers.sort((a, b) => (b.year || 0) - (a.year || 0));
                filesContainer.textContent = '';
                papers.forEach((paper, index) => {
                    const fileLink = document.createElement('div');
                    fileLink.classList.add('file-link');
                    const label = paper.year ? `${paper.title} (${paper.year})` : paper.title;
                    fileLink.textContent = `${index + 1}. ${label}`;
                    fileLink.onclick = () => loadFileContent(paper.name);
                    filesContainer.appendChild(fileLink);
                });
            })
            .catch(error => {
                console.error('Error fetching file list:', error);
                filesContainer.textContent = document.documentElement.className === 'lang-tr'
                    ? 'Yazı listesi yüklenemedi. Lütfen daha sonra tekrar deneyin.'
                    : 'Could not load the paper list. Please try again later.';
            });

        function loadFileContent(fileName) {
            if (fileContentDiv.dataset.currentFile === fileName) {
                fileContentDiv.style.display = 'none';
                fileContentDiv.dataset.currentFile = '';
                return;
            }

            const render = markdown => {
                const { body } = parseFrontmatter(markdown);
                const converter = new showdown.Converter();
                fileContentDiv.innerHTML = converter.makeHtml(body);
                fileContentDiv.style.display = 'block';
                fileContentDiv.dataset.currentFile = fileName;
            };

            if (contentCache[fileName]) {
                render(contentCache[fileName]);
                return;
            }

            const fileUrl = `https://raw.githubusercontent.com/dogacol/Academic-Papers/main/${encodeURIComponent(fileName)}`;
            fetch(fileUrl)
                .then(response => response.text())
                .then(render)
                .catch(error => console.error('Error fetching file content:', error));
        }

        function goToIndex() {
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
